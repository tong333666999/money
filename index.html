<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>資產管理追蹤器 - 台幣市值統一版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; text-align: center; }
        .card .value { font-size: 2em; font-weight: bold; }
        .form-section { background: #f8f9fa; padding: 25px; border-radius: 15px; margin-bottom: 25px; border: 1px solid #eee; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        input, select { padding: 12px; border: 2px solid #ddd; border-radius: 8px; width: 100%; }
        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; margin: 5px; font-size: 0.9em; }
        .btn-add { background: #667eea; }
        .btn-update { background: #48bb78; margin-bottom: 20px; }
        .btn-filter { background: #6c757d; }
        .btn-filter.active { background: #007bff; box-shadow: 0 0 10px rgba(0,123,255,0.5); }
        .btn-edit { background: #ffc107; color: #212529; }
        .btn-delete { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; margin-bottom: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .loading { color: #667eea; font-weight: bold; display: none; margin-left: 10px; }
        .charts-container { display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px; justify-content: center; }
        .chart-wrapper { width: 450px; background: #f8f9fa; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .chart-title { text-align: center; margin-bottom: 15px; font-size: 1.4em; color: #333; }
        .filter-buttons { text-align: center; margin: 20px 0; }

        /* 修改彈跳視窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-header { font-size: 1.4em; margin-bottom: 20px; text-align: center; color: #333; }
        .modal-input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; }
        .modal-buttons { text-align: right; margin-top: 20px; }
        .btn-save { background: #28a745; }
        .btn-cancel { background: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 全球資產配置 (台幣計價)</h1>
        
        <div class="dashboard">
            <div class="card"><h3>總淨值 (TWD)</h3><div class="value" id="totalNetWorth">$0</div></div>
            <div class="card"><h3>總淨值 (USD)</h3><div class="value" id="totalNetWorthUSD">$0</div></div>
            <div class="card"><h3>今日總損益 (TWD)</h3><div class="value" id="totalProfit">$0</div></div>
            <div class="card"><h3>美金匯率</h3><div class="value" id="displayExRateUsd">--</div></div>
            <div class="card"><h3>日圓匯率</h3><div class="value" id="displayExRateJpy">--</div></div>
            <div class="card"><h3>瑞士法郎匯率</h3><div class="value" id="displayExRateChf">--</div></div>
        </div>

        <div class="form-section">
            <div class="form-grid">
                <div><label>類別</label>
                    <select id="assetType">
                        <option value="tw_stock">台股 (2330)</option>
                        <option value="us_stock">美/英股 (QQQ, VWRA.L)</option>
                        <option value="crypto">虛擬幣 (BTC)</option>
                        <option value="cash">現金/負債</option>
                    </select>
                </div>
                <div><label>代號</label><input type="text" id="assetSymbol" placeholder="例如: BTC, QQQ, TWD, USD"></div>
                <div><label>數量</label><input type="number" id="assetQuantity" step="0.0001"></div>
                <div><label>成本(原幣)</label><input type="number" id="assetCost" step="0.01"></div>
                <div style="display: flex; align-items: flex-end;"><button class="btn btn-add" onclick="addAsset()">新增資產</button></div>
            </div>
        </div>

        <button class="btn btn-update" onclick="updateAllPrices()">🔄 更新報價與匯率</button>
        <span id="loadingStatus" class="loading">正在連線 Yahoo Finance...</span>

        <table id="assetsTable">
            <thead>
                <tr>
                    <th>類別</th>
                    <th>代號</th>
                    <th>數量</th>
                    <th>現價(原幣)</th>
                    <th>市值(台幣)</th>
                    <th>損益%</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="assetsBody"></tbody>
        </table>

        <div class="filter-buttons">
            <button class="btn btn-filter active" onclick="switchChart('all')">總資產</button>
            <button class="btn btn-filter" onclick="switchChart('tw_stock')">台股</button>
            <button class="btn btn-filter" onclick="switchChart('us_stock')">美/英股</button>
            <button class="btn btn-filter" onclick="switchChart('crypto')">虛擬幣</button>
            <button class="btn btn-filter" onclick="switchChart('cash_positive')">現金（正）</button>
        </div>

        <div class="charts-container">
            <div class="chart-wrapper">
                <div class="chart-title" id="positiveChartTitle">正資產配置（類別 + 代號）</div>
                <canvas id="positiveChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <div class="chart-title">負債配置</div>
                <canvas id="negativeChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 修改彈跳視窗 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">修改資產</div>
            <p><strong>代號：</strong><span id="editSymbol"></span></p>
            <label>數量</label>
            <input type="number" id="editQuantity" class="modal-input" step="0.0001">
            <label>成本（原幣）</label>
            <input type="number" id="editCost" class="modal-input" step="0.01">
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-save" onclick="saveEdit()">儲存</button>
            </div>
        </div>
    </div>

    <script>
        let assets = JSON.parse(localStorage.getItem('assets')) || [];
        const proxy = 'https://api.allorigins.win/get?url=';

        let exchangeRates = {
            TWD: 1,
            USD: 32.5,
            JPY: 0.21,
            CHF: 38
        };

        let positiveChart = null;
        let negativeChart = null;
        let currentFilter = 'all';
        let editingId = null;

        function addAsset() {
            const type = document.getElementById('assetType').value;
            const symbol = document.getElementById('assetSymbol').value.toUpperCase().trim();
            const quantity = parseFloat(document.getElementById('assetQuantity').value);
            const cost = parseFloat(document.getElementById('assetCost').value);

            if (!symbol || isNaN(quantity) || isNaN(cost)) {
                alert("請填寫完整資訊");
                return;
            }

            const asset = {
                id: Date.now(),
                type: type,
                symbol: symbol,
                quantity: quantity,
                cost: cost,
                currentPrice: 0
            };

            assets.push(asset);
            saveAndRender();
            document.getElementById('assetSymbol').value = '';
            document.getElementById('assetQuantity').value = '';
            document.getElementById('assetCost').value = '';
        }

        async function updateAllPrices() {
            document.getElementById('loadingStatus').style.display = 'inline';
            
            try {
                const currencies = ['USD', 'JPY', 'CHF'];
                for (let curr of currencies) {
                    const exUrl = `${proxy}${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${curr}TWD=X?interval=1d&range=1d`)}`;
                    const exResp = await fetch(exUrl);
                    const exJson = await exResp.json();
                    const exData = JSON.parse(exJson.contents);
                    if (exData.chart && exData.chart.result && exData.chart.result[0]) {
                        exchangeRates[curr] = exData.chart.result[0].meta.regularMarketPrice;
                    }
                }

                document.getElementById('displayExRateUsd').textContent = exchangeRates.USD.toFixed(2);
                document.getElementById('displayExRateJpy').textContent = exchangeRates.JPY.toFixed(4);
                document.getElementById('displayExRateChf').textContent = exchangeRates.CHF.toFixed(2);

                for (let asset of assets) {
                    let currency = 'TWD';
                    if (asset.type === 'us_stock' || asset.type === 'crypto') currency = 'USD';
                    else if (asset.type === 'cash') {
                        currency = asset.symbol;
                        if (currency === 'TWD') { asset.currentPrice = 1; continue; }
                        if (exchangeRates[currency]) { asset.currentPrice = exchangeRates[currency]; continue; }
                    }

                    let ySymbol = asset.symbol;
                    if (asset.type === 'tw_stock' && !ySymbol.includes('.')) ySymbol += '.TW';
                    if (asset.type === 'crypto' && !ySymbol.includes('-')) ySymbol += '-USD';
                    
                    const priceUrl = `${proxy}${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${ySymbol}?interval=1d&range=1d`)}`;
                    try {
                        const pResp = await fetch(priceUrl);
                        const pJson = await pResp.json();
                        const pData = JSON.parse(pJson.contents);
                        if (pData.chart && pData.chart.result && pData.chart.result[0]) {
                            asset.currentPrice = pData.chart.result[0].meta.regularMarketPrice;
                        }
                    } catch (e) {
                        console.warn(`無法取得 ${ySymbol} 價格`, e);
                    }
                }
            } catch (e) {
                console.error("更新失敗", e);
                alert("更新過程發生錯誤，請檢查網路或稍後再試");
            }
            
            document.getElementById('loadingStatus').style.display = 'none';
            saveAndRender();
        }

        // 修改功能
        function openEditModal(id) {
            const asset = assets.find(a => a.id === id);
            if (!asset) return;

            editingId = id;
            document.getElementById('editSymbol').textContent = asset.symbol;
            document.getElementById('editQuantity').value = asset.quantity;
            document.getElementById('editCost').value = asset.cost;
            document.getElementById('editModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            editingId = null;
        }

        function saveEdit() {
            if (editingId === null) return;

            const newQuantity = parseFloat(document.getElementById('editQuantity').value);
            const newCost = parseFloat(document.getElementById('editCost').value);

            if (isNaN(newQuantity) || isNaN(newCost)) {
                alert("請輸入有效的數量與成本");
                return;
            }

            const asset = assets.find(a => a.id === editingId);
            asset.quantity = newQuantity;
            asset.cost = newCost;

            closeModal();
            saveAndRender();
        }

        function render() {
            const body = document.getElementById('assetsBody');
            body.innerHTML = '';
            let totalNetWorthTWD = 0;
            let totalProfitTWD = 0;

            const categoryMap = {};
            const negativeData = [];
            const allPositiveItems = [];

            assets.forEach(a => {
                const price = a.currentPrice || a.cost || 0;
                let currency = 'TWD';
                if (a.type === 'us_stock' || a.type === 'crypto') currency = 'USD';
                else if (a.type === 'cash') currency = a.symbol;

                const rate = exchangeRates[currency] || 1;

                let marketValueTWD = (a.type === 'cash') ? a.quantity * price : a.quantity * price * rate;
                const costValueTWD = a.quantity * a.cost * (exchangeRates[currency] || 1);

                totalNetWorthTWD += marketValueTWD;
                totalProfitTWD += (marketValueTWD - costValueTWD);

                const profitPct = (currency === 'TWD' || a.cost === 0) ? 0 : (((price - a.cost) / a.cost) * 100).toFixed(2);

                const catLabel = a.type === 'tw_stock' ? '台股' :
                                 a.type === 'us_stock' ? '美/英股' :
                                 a.type === 'crypto' ? '虛擬幣' : '現金/負債';

                body.innerHTML += `
                    <tr>
                        <td>${catLabel}</td>
                        <td>${a.symbol}</td>
                        <td>${a.quantity.toLocaleString()}</td>
                        <td>${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6})}</td>
                        <td>${Math.round(marketValueTWD).toLocaleString()}</td>
                        <td style="color: ${profitPct >= 0 ? 'red' : 'green'}">${profitPct > 0 ? '+' : ''}${profitPct}%</td>
                        <td>
                            <button class="btn btn-edit" onclick="openEditModal(${a.id})">修改</button>
                            <button class="btn btn-delete" onclick="deleteAsset(${a.id})">刪除</button>
                        </td>
                    </tr>
                `;

                const absValue = Math.abs(marketValueTWD);
                if (absValue < 1000) return;

                const item = {
                    symbol: a.symbol,
                    value: marketValueTWD,
                    label: `${a.symbol} (${catLabel})`
                };

                if (marketValueTWD > 0) {
                    if (!categoryMap[catLabel]) categoryMap[catLabel] = { total: 0, items: [] };
                    categoryMap[catLabel].total += marketValueTWD;
                    categoryMap[catLabel].items.push(item);
                    allPositiveItems.push({ ...item, cat: catLabel });
                } else {
                    negativeData.push({ label: item.label, value: absValue });
                }
            });

            const totalNetWorthUSD = totalNetWorthTWD / exchangeRates.USD;
            document.getElementById('totalNetWorth').textContent = `$${Math.round(totalNetWorthTWD).toLocaleString()}`;
            document.getElementById('totalNetWorthUSD').textContent = `$${Math.round(totalNetWorthUSD).toLocaleString()}`;
            document.getElementById('totalProfit').textContent = (totalProfitTWD >= 0 ? '+' : '') + `$${Math.round(totalProfitTWD).toLocaleString()}`;

            window.chartData = { categoryMap, negativeData, allPositiveItems };
            drawCharts(currentFilter);
        }

        function switchChart(filter) {
            currentFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            drawCharts(filter);
        }

        function drawCharts(filter) {
            const data = window.chartData || { categoryMap: {}, negativeData: [], allPositiveItems: [] };
            const { categoryMap, negativeData } = data;

            const categoryColors = {
                '台股': '#FF6384',
                '美/英股': '#36A2EB',
                '虛擬幣': '#FFCE56',
                '現金/負債': '#4BC0C0'
            };

            // 正資產圖表
            const posCtx = document.getElementById('positiveChart').getContext('2d');
            if (positiveChart) positiveChart.destroy();

            if (filter === 'all') {
                document.getElementById('positiveChartTitle').textContent = '正資產配置（類別 + 代號）';

                const outerLabels = [];
                const outerData = [];
                const outerBg = [];
                const innerData = [];
                const innerBg = [];

                Object.keys(categoryMap).forEach(cat => {
                    if (categoryMap[cat].total > 0) {
                        outerLabels.push(cat);
                        outerData.push(categoryMap[cat].total);
                        outerBg.push(categoryColors[cat]);

                        categoryMap[cat].items.forEach(item => {
                            innerData.push(item.value);
                            innerBg.push(categoryColors[cat] + 'CC');
                        });
                    }
                });

                positiveChart = new Chart(posCtx, {
                    type: 'doughnut',
                    data: {
                        labels: outerLabels,
                        datasets: [{
                            data: outerData,
                            backgroundColor: outerBg
                        }, {
                            data: innerData,
                            backgroundColor: innerBg
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let cum = 0;
                                        if (context.datasetIndex === 0) {
                                            return `${outerLabels[context.dataIndex]}: NT$${Math.round(context.parsed).toLocaleString()}`;
                                        } else {
                                            for (let i = 0; i < outerLabels.length; i++) {
                                                const count = categoryMap[outerLabels[i]].items.length;
                                                if (context.dataIndex < cum + count) {
                                                    const item = categoryMap[outerLabels[i]].items[context.dataIndex - cum];
                                                    return `${item.label}: NT$${Math.round(context.parsed).toLocaleString()}`;
                                                }
                                                cum += count;
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                });
            } else {
                let title = '';
                let items = [];

                if (filter === 'tw_stock') { title = '台股 配置'; items = categoryMap['台股']?.items || []; }
                else if (filter === 'us_stock') { title = '美/英股 配置'; items = categoryMap['美/英股']?.items || []; }
                else if (filter === 'crypto') { title = '虛擬幣 配置'; items = categoryMap['虛擬幣']?.items || []; }
                else if (filter === 'cash_positive') {
                    title = '現金（正） 配置';
                    items = categoryMap['現金/負債']?.items.filter(i => i.value > 0) || [];
                }

                document.getElementById('positiveChartTitle').textContent = title;

                const labels = items.map(i => i.symbol);
                const values = items.map(i => i.value);
                const bgColors = items.map(() => categoryColors[title.split(' ')[0]] || '#9966FF');

                positiveChart = new Chart(posCtx, {
                    type: 'pie',
                    data: {
                        labels: labels.length > 0 ? labels : ['無資料'],
                        datasets: [{
                            data: values.length > 0 ? values : [1],
                            backgroundColor: bgColors.length > 0 ? bgColors : ['#ddd']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const label = context.label || '';
                                        const value = context.parsed;
                                        return `${label}: NT$${Math.round(value).toLocaleString()}`;
                                    }
                                }
                            }
                        }
                    }
                });
            }

            // 負債圖表
            const negCtx = document.getElementById('negativeChart').getContext('2d');
            if (negativeChart) negativeChart.destroy();

            negativeChart = new Chart(negCtx, {
                type: 'pie',
                data: {
                    labels: negativeData.length > 0 ? negativeData.map(d => d.label) : ['無負債'],
                    datasets: [{
                        data: negativeData.length > 0 ? negativeData.map(d => d.value) : [1],
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    const value = context.parsed;
                                    return `${label}: NT$${Math.round(value).toLocaleString()}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function saveAndRender() {
            localStorage.setItem('assets', JSON.stringify(assets));
            render();
        }

        function deleteAsset(id) {
            if (confirm("確定要刪除這筆資產嗎？")) {
                assets = assets.filter(a => a.id !== id);
                saveAndRender();
            }
        }

        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
